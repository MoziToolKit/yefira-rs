[package]
name = "yefira-rs"
version = "0.1.0"
edition = "2021"
authors = ["Mozi <mozi1924@arasaka.ltd>"]
license = "GPL-3.0-or-later"
description = "High-performance Rust-native Minecraft live synchronization server for Horizon and libmozitoolkit (RFC v3.1)"

[dependencies]
glam = { version = "0.34", features = ["serde"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }
tungstenite = { version = "0.30", features = ["handshake"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
parking_lot = "0.12"
thiserror = "2.0"
log = "0.4"

[dev-dependencies]
env_logger = "0.11"
mtk-sync = { path = "../libmozitoolkit/crates/mtk-sync" }
mtk-voxel = { path = "../libmozitoolkit/crates/mtk-voxel" }
mtk-model = { path = "../libmozitoolkit/crates/mtk-model" }
