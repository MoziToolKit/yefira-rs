[package]
name = "yefira-rs"
version = "0.1.0"
edition = "2024"
authors = ["Mozi <mozi1924@arasaka.ltd>"]
license = "GPL-3.0-or-later"
description = "High-performance Rust-native Minecraft live synchronization server for Horizon and libmozitoolkit (RFC v3.1)"

[dependencies]
glam = { version = "0.30", features = ["serde"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }
tungstenite = { version = "0.30", default-features = false }
sha1 = "0.10"
base64 = "0.22"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
thiserror = "2.0"
log = "0.4"
horizon-client = { git = "https://github.com/horizon-rust/horizon.git", rev = "f4858e8a25244093a84ec6468c3fd262ea0c3299", default-features = false }

[dev-dependencies]
env_logger = "0.11"
glam_mtk = { version = "0.34", package = "glam" }
mtk-sync = { git = "https://github.com/MoziToolKit/libmozitoolkit.git" }
mtk-voxel = { git = "https://github.com/MoziToolKit/libmozitoolkit.git" }
mtk-model = { git = "https://github.com/MoziToolKit/libmozitoolkit.git" }
