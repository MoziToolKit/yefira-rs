[package]
name = "mod-yefira"
version = "0.1.0"
edition = "2024"

[dependencies]
horizon-client = { git = "https://github.com/horizon-rust/horizon", rev = "41f822b659789780f58d32c63ddfb6887ea1b8bf" }
glam = { version = "0.30", features = ["serde"] }
xxhash-rust = { version = "0.8", features = ["xxh64"] }
tungstenite = { version = "0.30", features = ["handshake"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
parking_lot = "0.12"
thiserror = "2.0"
log = "0.4"
